name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  web:
    name: Web/server artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: build + package
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          OUT: dist
        run: ./scripts/build-release.sh
      - name: build Debian server packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          for pair in amd64:amd64 arm64:arm64 arm:armhf; do
            goarch="${pair%%:*}"
            debarch="${pair##*:}"
            bin="dist/rms-radar-web-${VER}-linux-${goarch}"
            [ -f "$bin" ] || { echo "missing $bin" >&2; exit 1; }
            OUT=dist ./scripts/build-deb.sh "$bin" rms-radar "$VER" "$debarch" web
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: dist/*

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: install MinGW for Windows CGo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\\ProgramData\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: build + package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          OUT: dist-desktop
        run: ./scripts/build-desktop.sh
      - name: build Debian desktop package
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          bin="dist-desktop/rms-radar-desktop-${VER}-linux-amd64"
          [ -f "$bin" ] || { echo "missing $bin" >&2; exit 1; }
          OUT=dist-desktop ./scripts/build-deb.sh "$bin" rms-radar-desktop "$VER" amd64 desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist-desktop/*

  rpm:
    name: RPM packages
    needs: [verify, desktop]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-ubuntu-latest
          path: desktop-linux
      - name: build RPMs
        run: |
          dnf -y install golang rpm-build systemd-rpm-macros
          cd "$GITHUB_WORKSPACE"
          VER="${GITHUB_REF_NAME#v}"
          PREFIX="rms-radar-${VER}"
          mkdir -p "$HOME/rpmbuild/SOURCES" "$HOME/rpmbuild/SPECS"
          tar -czf "$HOME/rpmbuild/SOURCES/${PREFIX}.tar.gz" \
            --exclude=.git --transform "s,^\\./,${PREFIX}/," .
          rpmbuild -ba packaging/rpm/rms-radar.spec

          # Native desktop client, packaged from the binary built once on the
          # Linux desktop job. This keeps the RPM identical to the tarball and
          # .deb instead of rebuilding WebKitGTK CGo code on every distro.
          bin="desktop-linux/rms-radar-desktop-${VER}-linux-amd64"
          [ -f "$bin" ] || { echo "missing $bin" >&2; exit 1; }
          cp "$bin" "$HOME/rpmbuild/SOURCES/rms-radar-desktop"
          cp contrib/desktop/rms-radar-desktop.desktop \
            contrib/desktop/rms-radar.svg \
            contrib/desktop/rms-radar-1024.png \
            LICENSE "$HOME/rpmbuild/SOURCES/"
          sed "s/^Version:.*/Version: ${VER}/" \
            packaging/rpm/rms-radar-desktop.spec > "$HOME/rpmbuild/SPECS/rms-radar-desktop.spec"
          rpmbuild -bb "$HOME/rpmbuild/SPECS/rms-radar-desktop.spec"

          mkdir -p dist-rpm
          cp "$HOME/rpmbuild/RPMS"/*/*.rpm dist-rpm/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm
          path: dist-rpm/*

  arch:
    name: Arch packages
    needs: [verify, desktop]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-ubuntu-latest
          path: desktop-linux
      - name: build Arch packages
        run: |
          pacman -Sy --noconfirm --needed base-devel go curl
          useradd -m builder
          chown -R builder:builder .
          VER="${GITHUB_REF_NAME#v}"
          # Verify the tagged source tarball instead of bypassing checksums.
          curl -fsSL -o "$GITHUB_WORKSPACE/packaging/arch/rms-radar-${VER}.tar.gz" \
            "https://github.com/ben-kuhn/rms-radar/archive/refs/tags/v${VER}.tar.gz"
          SHA="$(sha256sum "$GITHUB_WORKSPACE/packaging/arch/rms-radar-${VER}.tar.gz" | awk '{print $1}')"
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" "$GITHUB_WORKSPACE/packaging/arch/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${VER}/" "$GITHUB_WORKSPACE/packaging/arch/PKGBUILD"
          chown -R builder:builder .
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm"

          # Native desktop client, packaged from the same tested binary as the
          # tarball, .deb, and RPM.
          bin="desktop-linux/rms-radar-desktop-${VER}-linux-amd64"
          [ -f "$bin" ] || { echo "missing $bin" >&2; exit 1; }
          cp "$bin" packaging/arch/rms-radar-desktop
          cp contrib/desktop/rms-radar-desktop.desktop \
            contrib/desktop/rms-radar.svg \
            contrib/desktop/rms-radar-1024.png \
            LICENSE packaging/arch/
          sed -i "s/^pkgver=.*/pkgver=${VER}/" packaging/arch/PKGBUILD.desktop
          chown -R builder:builder packaging/arch
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg -p PKGBUILD.desktop --noconfirm --nodeps"

          mkdir -p dist-arch
          cp packaging/arch/*.pkg.tar.zst dist-arch/
          # Publish the recipes alongside the built packages so users can
          # inspect, rebuild, or adapt them without cloning the repository.
          cp packaging/arch/PKGBUILD dist-arch/PKGBUILD
          cp packaging/arch/PKGBUILD.desktop dist-arch/PKGBUILD.desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch
          path: dist-arch/*

  voacap-linux:
    name: VOACAP bundle (Linux)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
      - name: build bundle
        env:
          OUT: dist-voacap
          GOOS: linux
          GOARCH: amd64
        run: ./scripts/build-voacap.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voacap-linux
          path: dist-voacap/*

  voacap-macos:
    name: VOACAP bundle (macOS)
    needs: verify
    # The macOS engine/data bundle is static and was built and smoke-tested on
    # a macOS runner in CI. Reuse the pinned, signed v0.2.6 mirror here so the
    # release does not depend on scarce macOS arm64 runner capacity; the sign
    # job re-signs it with the current key.
    runs-on: ubuntu-latest
    steps:
      - name: fetch pinned macOS bundle
        run: |
          set -euo pipefail
          mkdir -p dist-voacap
          base="https://github.com/ben-kuhn/rms-radar/releases/download/v0.2.6"
          name="voacap-macos-arm64.tar.gz"
          expected="f02b03f8763189489dd92cc7843128bba4b85d91978bd08060ff4fde70fb1214"
          curl -fsSL --retry 4 --retry-delay 5 -o "dist-voacap/$name" "$base/$name"
          got="$(sha256sum "dist-voacap/$name" | awk '{print $1}')"
          [ "$got" = "$expected" ] || { echo "macOS bundle SHA-256 mismatch: $got" >&2; exit 1; }
          curl -fsSL --retry 4 --retry-delay 5 -o "dist-voacap/$name.sha256" "$base/$name.sha256"
          (cd dist-voacap && sha256sum -c "$name.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voacap-macos
          path: dist-voacap/*

  voacap-windows:
    name: VOACAP bundle (Windows)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: assemble bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist-voacap | Out-Null
          New-Item -ItemType Directory -Force work | Out-Null
          # Upstream's official Windows distribution (engine, data, runtime DLL).
          # Canonical Windows bundle, built once from the pinned upstream ITS HF
          # archive and mirrored on our release. Pin its digest so a changed
          # mirror fails the build; the release workflow signs it anew.
          $source = "https://github.com/ben-kuhn/rms-radar/releases/download/v0.2.4/voacap-windows-amd64.zip"
          $expected = "4ba9895b2cee0305017aa3dd1918380bf35cee837772db348bbc50a4241b34e9"
          $downloaded = $false
          for ($i = 0; $i -lt 4 -and -not $downloaded; $i++) {
            try {
              Invoke-WebRequest -Uri $source -OutFile "dist-voacap/voacap-windows-amd64.zip" -TimeoutSec 120
              $downloaded = $true
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $downloaded) { throw "could not download the canonical VOACAP Windows bundle" }
          $actual = (Get-FileHash "dist-voacap/voacap-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "canonical VOACAP Windows bundle SHA-256 mismatch: got $actual" }
          Expand-Archive -Path "dist-voacap/voacap-windows-amd64.zip" -DestinationPath "work/win"
          if (-not (Test-Path "work/win/itshfbc/bin_win/voacapw.exe")) { throw "voacapw.exe missing from bundle" }
          if (-not (Test-Path "work/win/itshfbc/bin_win/SALFLIBC.DLL")) { throw "SALFLIBC.DLL missing from bundle" }
          "$expected  voacap-windows-amd64.zip" | Out-File -FilePath "dist-voacap/voacap-windows-amd64.zip.sha256" -Encoding ascii
      - name: smoke-test the engine
        shell: pwsh
        env:
          RMSRADAR_TEST_VOACAP_EXECUTABLE: ${{ github.workspace }}\work\win\itshfbc\bin_win\voacapw.exe
          RMSRADAR_TEST_VOACAP_DATA_DIR: ${{ github.workspace }}\work\win\itshfbc
        run: go test ./internal/propagation -run TestVOACAPLocalRealEngine -v -count=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voacap-windows
          path: dist-voacap/*

  sign:
    name: Sign VOACAP bundles
    needs: [voacap-linux, voacap-macos, voacap-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "voacap-*"
          path: unsigned
          merge-multiple: true
      - name: install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: sign bundles
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.VOACAP_MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_SECRET_KEY" || { echo "VOACAP_MINISIGN_SECRET_KEY is not configured" >&2; exit 1; }
          mkdir -p signed/voacap
          cp unsigned/* signed/voacap/
          key="$RUNNER_TEMP/voacap.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          shopt -s nullglob
          for f in signed/voacap/voacap-*.tar.gz signed/voacap/voacap-*.zip; do
            minisign -S -s "$key" -m "$f" -x "$f.minisig" -c "RMS Radar VOACAP bundle"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voacap-signed
          path: signed/voacap/*

  publish:
    name: Publish release
    needs: [web, desktop, rpm, arch, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: keep only the signed VOACAP artifacts
        run: |
          rm -rf artifacts/voacap-linux artifacts/voacap-macos artifacts/voacap-windows
      - name: combine checksums
        run: |
          find artifacts -name checksums.txt -delete
          (cd artifacts && find . -type f -print0 | sort -z | xargs -0 sha256sum \
            | sed -E 's#  \./[^/]+/#  #; s#  \./#  #') > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*
            SHA256SUMS
