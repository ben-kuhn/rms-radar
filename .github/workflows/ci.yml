name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: go test (with coverage)
        run: go test -coverprofile=coverage.out ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: coverage floor
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "total coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { if (t+0 < 50) { print "::error::coverage " t "% is below the 50% floor"; exit 1 } }'
      - name: per-package coverage floors
        run: ./scripts/check-coverage.sh
      - name: upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, artos: linux }
          - { goos: linux,   goarch: arm64, artos: linux }
          - { goos: linux,   goarch: arm,   artos: linux }
          - { goos: darwin,  goarch: amd64, artos: macos }
          - { goos: darwin,  goarch: arm64, artos: macos }
          - { goos: windows, goarch: amd64, artos: windows }
          - { goos: windows, goarch: arm64, artos: windows }
          - { goos: freebsd, goarch: amd64, artos: freebsd }
          - { goos: openbsd, goarch: amd64, artos: openbsd }
          - { goos: netbsd,  goarch: amd64, artos: netbsd }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}" .
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}
          path: dist/rms-radar-web-${{ matrix.artos }}-${{ matrix.goarch }}

  e2e:
    name: Browser tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: start the server
        run: |
          go build -o /tmp/rms-radar .
          /tmp/rms-radar -d -listen 127.0.0.1:8079 -cache-dir /tmp/rms-data > /tmp/rms-radar.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8079/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8079/api/health
      - name: install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: run browser tests
        working-directory: tests/e2e
        env:
          BASE_URL: http://127.0.0.1:8079
        run: npx playwright test

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: install MinGW for Windows CGo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: build native desktop binary
        shell: bash
        run: ./scripts/build-desktop.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist-desktop/*

  voacap:
    name: VOACAP bundle (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
      - name: install gfortran (macOS)
        if: runner.os == 'macOS'
        run: brew install gfortran || brew install gcc
      - name: build bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          OUT: dist-voacap
        run: ./scripts/build-voacap.sh
      - name: unpack bundle for smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/voacap-bundle"
          tar -xzf dist-voacap/voacap-*.tar.gz -C "$RUNNER_TEMP/voacap-bundle"
      - name: smoke-test engine (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          RMSRADAR_TEST_VOACAP_EXECUTABLE: ${{ runner.temp }}/voacap-bundle/voacap/voacapl
          RMSRADAR_TEST_VOACAP_DATA_DIR: ${{ runner.temp }}/voacap-bundle/voacap/itshfbc
        run: go test ./internal/propagation -run TestVOACAPLocalRealEngine -v -count=1
      - name: assemble bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist-voacap | Out-Null
          New-Item -ItemType Directory -Force work | Out-Null
          # Canonical Windows bundle, built once from the pinned upstream ITS HF
          # archive and mirrored on our release. Pin its digest so a changed
          # mirror fails the build; the release workflow signs it anew.
          $source = "https://github.com/ben-kuhn/rms-radar/releases/download/v0.2.4/voacap-windows-amd64.zip"
          $expected = "4ba9895b2cee0305017aa3dd1918380bf35cee837772db348bbc50a4241b34e9"
          $downloaded = $false
          for ($i = 0; $i -lt 4 -and -not $downloaded; $i++) {
            try {
              Invoke-WebRequest -Uri $source -OutFile "dist-voacap/voacap-windows-amd64.zip" -TimeoutSec 120
              $downloaded = $true
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $downloaded) { throw "could not download the canonical VOACAP Windows bundle" }
          $actual = (Get-FileHash "dist-voacap/voacap-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "canonical VOACAP Windows bundle SHA-256 mismatch: got $actual" }
          Expand-Archive -Path "dist-voacap/voacap-windows-amd64.zip" -DestinationPath "work/win"
          if (-not (Test-Path "work/win/itshfbc/bin_win/voacapw.exe")) { throw "voacapw.exe missing from bundle" }
          if (-not (Test-Path "work/win/itshfbc/bin_win/SALFLIBC.DLL")) { throw "SALFLIBC.DLL missing from bundle" }
          "$expected  voacap-windows-amd64.zip" | Out-File -FilePath "dist-voacap/voacap-windows-amd64.zip.sha256" -Encoding ascii
      - name: smoke-test engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RMSRADAR_TEST_VOACAP_EXECUTABLE: ${{ github.workspace }}\work\win\itshfbc\bin_win\voacapw.exe
          RMSRADAR_TEST_VOACAP_DATA_DIR: ${{ github.workspace }}\work\win\itshfbc
        run: go test ./internal/propagation -run TestVOACAPLocalRealEngine -v -count=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voacap-${{ matrix.os }}
          path: dist-voacap/*

  macos:
    name: macOS desktop + VOACAP
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: install gfortran
        run: brew install gfortran || brew install gcc
      - name: build desktop
        env:
          OUT: dist-desktop
        run: ./scripts/build-desktop.sh
      - name: build VOACAP bundle
        env:
          OUT: dist-voacap
        run: ./scripts/build-voacap.sh
      - name: unpack bundle for smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/voacap-bundle"
          tar -xzf dist-voacap/voacap-*.tar.gz -C "$RUNNER_TEMP/voacap-bundle"
      - name: smoke-test engine
        env:
          RMSRADAR_TEST_VOACAP_EXECUTABLE: ${{ runner.temp }}/voacap-bundle/voacap/voacapl
          RMSRADAR_TEST_VOACAP_DATA_DIR: ${{ runner.temp }}/voacap-bundle/voacap/itshfbc
        run: go test ./internal/propagation -run TestVOACAPLocalRealEngine -v -count=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-15
          path: dist-desktop/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voacap-macos-15
          path: dist-voacap/*

  docker:
    name: Container smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: build image
        run: docker build --build-arg VERSION=ci -t rms-radar:ci .
      - name: run and probe
        run: |
          set -euo pipefail
          docker run -d --name rms-radar-ci --read-only --tmpfs /tmp:size=64m             --cap-drop ALL --security-opt no-new-privileges:true             -p 127.0.0.1:18079:8079 rms-radar:ci
          trap 'docker logs rms-radar-ci || true; docker rm -f rms-radar-ci || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18079/api/health >/tmp/health.json; then break; fi
            sleep 2
          done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:18079/api/config | grep -q '"voacap":true'
          docker exec rms-radar-ci /usr/bin/voacapl -v
